[project]
name = "{{cookiecutter.target_id}}"
version = "0.0.1"
description = "Singer target for {{cookiecutter.destination_name}}, built with the Hotglue Singer SDK."
readme = "README.md"
authors = [{ name = "{{ cookiecutter.admin_name }}", email = "{{ cookiecutter.admin_email }}" }]
keywords = [
    "ELT",
    "{{cookiecutter.destination_name}}",
]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
{%- if cookiecutter.license != "None" %}
license = "{{cookiecutter.license}}"
{%- endif %}
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
dependencies = [
    "hotglue-singer-sdk @ git+https://github.com/hotgluexyz/HotglueSingerSDK.git@hgi-10250"
]

[project.optional-dependencies]
s3 = [
    "s3fs>=2026.1.0",
]

[project.scripts]
# CLI declaration
{{cookiecutter.target_id}} = '{{cookiecutter.library_name}}.target:Target{{ cookiecutter.destination_name }}.cli'

[dependency-groups]
dev = [
    { include-group = "test" },
]
test = [
    "pytest>=9",
    "hotglue-singer-sdk[testing]>=1.0.26",
]
typing = [
    "mypy>=1.19.1",
    "ty>=0.0.18",
    "types-requests",
]

[tool.hatch.version]
fallback-version = "0.1.0.dev0"
source = "vcs"

[tool.mypy]
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ty.rules]
unused-type-ignore-comment = "ignore"

[tool.pytest]
addopts = [
    "-ra",
]
filterwarnings = [
    "error",
]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
required-version = ">=0.15"

[tool.ruff.lint]
future-annotations = true
ignore = [
    "COM812",  # missing-trailing-comma
    "FIX002",  # TODO placeholders in generated project stubs
    "TD002",
    "TD003",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",  # assert is used by pytest
]
"{{cookiecutter.library_name}}/client.py" = [
    "ANN401",  # authenticator return type varies by auth_method until narrowed
    "D102",  # SDK override stubs ship without per-method docstrings
    "I001",  # optional cookiecutter branches; run `ruff check --fix` after render if desired
]
"{{cookiecutter.library_name}}/sinks.py" = [
    "D102",
    "I001",
]
"{{cookiecutter.library_name}}/target.py" = [
    "RUF012",  # SINK_TYPES is a Singer SDK class-level registry pattern
    "I001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# This configuration can be used to customize tox environments
[tool.tox]
requires = [
    "tox>=4.43",
    "tox-uv",
]
env_list = [
    "lint",
    "typing",
    "3.10",
]

[tool.tox.env_run_base]
description = "run tests on Python {env_name}"
runner = "uv-venv-runner"
pass_env = [
    "{{cookiecutter.target_id.replace('-', '_').upper()}}_*",
]
dependency_groups = [ "test" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]

[tool.tox.env.lint]
description = "run ruff linter and formatter check"
skip_install = true
dependency_groups = []
deps = ["ruff>=0.15"]
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
]

[tool.tox.env.typing]
description = "type checks"
dependency_groups = [ "test", "typing" ]
commands = [
    [ "mypy", { replace = "posargs", default = [ "{{cookiecutter.library_name}}", "tests" ], extend = true } ],
    [ "ty", "check", { replace = "posargs", default = [ "{{cookiecutter.library_name}}", "tests" ], extend = true } ],
]

